[project]
name = "indexforge"
version = "0.2.0"
description = "Build rules-based financial indices from a spec file, in Python or from the command line"
authors = [{name = "Reuben Capio", email = "reuben@indexmaker.io"}]
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = [
    "finance",
    "index",
    "stock market",
    "investment",
    "portfolio",
    "benchmark",
    "weighting",
    "rebalancing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "yfinance>=0.2.35,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# OpenBB pulls in a large dependency tree, so it is opt-in.
openbb = ["openbb>=4.5,<5"]
ai = ["openai>=1.0,<3"]
all = ["openbb>=4.5,<5", "openai>=1.0,<3"]

[project.scripts]
indexforge = "indexforge.cli:main"

[project.urls]
Homepage = "https://github.com/reubencapio/indexforge"
Repository = "https://github.com/reubencapio/indexforge"
Issues = "https://github.com/reubencapio/indexforge/issues"
Changelog = "https://github.com/reubencapio/indexforge/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{include = "indexforge", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
pytest-mock = "^3.12"
black = "^24.0"
mypy = "^1.8"
ruff = ">=0.13"
types-pyyaml = "^6.0"
pre-commit = "^3.6"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.ruff_cache
    | \.venv
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.coverage.run]
source = ["src/indexforge"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
